version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/weather-db
    depends_on:
      - mongodb
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev

  mongodb:
    image: mongo:latest
    ports:
      - '27018:27017'
    environment:
      - MONGO_INITDB_DATABASE=weather-db
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
